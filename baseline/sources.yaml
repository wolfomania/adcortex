# Reference clips for backend/src/adcortex/data/baseline.json.
# `make baseline` analyzes each clip on the deployed app and pools the
# predictions. Each clip needs a `url` or a local `path` (relative to the
# repository root), and its license. `start` and `end`, in seconds, cut a
# segment from a longer file.
#
# The Instagram clips are not redistributed. Before a rebuild, download each
# post, with its sound, into its `path`.
version: v2
description: 9 Instagram posts with sound, 12-117 s each.
