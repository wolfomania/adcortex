# Brain systems used to summarize TRIBE v2's cortical predictions.
#
# Each system is a set of HCP-MMP1.0 parcels (Glasser et al., 2016); both
# hemispheres are pooled. Parcel names must match atlas_fsaverage5.json.
#
# `confidence` states how much weight a system's curve can bear. It follows
# the pattern reported for whole-brain encoding models, including TRIBE v2:
# accuracy is highest in sensory cortex, intermediate in higher-level
# perceptual and language cortex, and lowest in association and prefrontal
# cortex, where fMRI signal is also noisier. It is a qualitative label, not a
# per-region accuracy measured by this app.
#
# `visual: true` marks systems that need a visual input; they are reported as
# not applicable for audio-only and script analyses.

version: 1
systems:
  - id: visual
    label: Early visual
    confidence: high
    visual: true
    parcels: [V1, V2, V3, V4]
    description: >-
      Low-level vision: contrast, edges, color, and how much the picture
      changes. Rises with bright, busy, or fast-changing frames.
    citations: [wandell2007, glasser2016]

  - id: motion
    label: Motion
    confidence: high
    visual: true
    parcels: [MT, MST, FST, V4t]
    description: >-
      The MT+ complex tracks visual motion: moving objects, camera moves,
      and optic flow.
    citations: [huk2002, glasser2016]

  - id: faces
    label: Faces
    confidence: medium
    visual: true
    parcels: [FFC, PIT]
    description: >-
      Fusiform face complex and posterior inferotemporal cortex, which respond
      most to faces and, more weakly, to bodies and objects.
    citations: [kanwisher1997, glasser2016]

  - id: scenes
    label: Places & scenes
    confidence: medium
    visual: true
    parcels: [PHA1, PHA2, PHA3, VMV1, VMV2, VMV3, RSC]
    description: >-
      Parahippocampal and retrosplenial areas that respond to places,
      landscapes, and spatial layout.
    citations: [epstein1998, glasser2016]

  - id: sound
    label: Sound
    confidence: high
    visual: false
    parcels: [A1, LBelt, MBelt, PBelt, RI]
    description: >-
      Early auditory cortex: loudness, pitch, and acoustic change in music,
      voice, and effects.
    citations: [moerel2014, glasser2016]

  - id: speech
    label: Speech & language
    confidence: medium
    visual: false
    parcels: [A4, A5, STSda, STSdp, STSva, STSvp, STGa, "44", "45", 47l, 55b, PSL, SFL]
    description: >-
      Superior temporal and inferior frontal language areas. They follow
      spoken words and, more strongly, meaningful sentences.
    citations: [fedorenko2010, glasser2016]

  - id: social
    label: Social cognition
    confidence: low
    visual: false
    parcels: [TPOJ1, TPOJ2, STV, PGi, TGd, TGv, 9m, PCV]
    description: >-
      Temporo-parietal junction, temporal pole, and medial cortex, linked to
      thinking about people's intentions and stories.
    citations: [saxe2003, glasser2016]

  - id: attention
    label: Attention
    confidence: medium
    visual: false
    parcels: [FEF, PEF, LIPv, LIPd, VIP, IPS1, 7PC, 7AL, 7PL, MIP, AIP]
    description: >-
      Dorsal attention network (frontal eye fields and intraparietal sulcus),
      engaged when the viewer orients to and tracks what is on screen.
    citations: [corbetta2002, glasser2016]

  - id: salience
    label: Salience
    confidence: low
    visual: false
    parcels: [AVI, AAIC, MI, FOP4, FOP5, a24pr, p24pr, 33pr, p32pr, a32pr]
    description: >-
      Anterior insula and dorsal anterior cingulate, which respond to
      surprising, important, or emotionally charged moments.
    citations: [seeley2007, glasser2016]

  - id: valuation
    label: Valuation
    confidence: low
    visual: false
    parcels: [10r, 10v, s32, "25", OFC, pOFC, 11l, 13l]
    description: >-
      Ventromedial prefrontal and orbitofrontal cortex, associated with
      subjective value. The least reliable system: fMRI signal here is weak.
    citations: [bartra2013, glasser2016]

citations:
