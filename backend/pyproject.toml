[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "neuromarketing"
version = "2.0.0"
description = "Predict cortical responses to ads with Meta's TRIBE v2 and explain them with any LLM."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.165",
    "uvicorn[standard]>=0.54",
    "python-multipart>=0.0.34",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "numpy>=2.2.6",
    "pyyaml>=6.0.2",
    "pydantic-ai-slim[google,anthropic,openai]>=2.71",
]

[project.optional-dependencies]
modal = ["modal>=1.6.4"]

[dependency-groups]
dev = [
    "modal>=1.6.4",
    "httpx>=0.28.1",
    "pytest>=9.2",
    "pytest-asyncio>=1.5",
    "pytest-cov>=7.1",
    "ruff>=0.17.6",
    "mypy>=2.4",
    "types-PyYAML>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/neuromarketing"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "ffmpeg: needs the ffmpeg and ffprobe binaries",
    "live_llm: calls a real LLM provider (excluded by default)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["neuromarketing"]
branch = true
omit = [
    # Runs only inside the Modal GPU image (torch, tribev2); covered by the
    # Modal smoke test, not by unit tests.
    "*/neuromarketing/brain/tribe.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "PT", "PIE", "RET", "TID", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "S603", "S607"]
"../scripts/**" = ["S", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["neuromarketing"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tribev2.*", "neuralset.*", "pandas.*", "torch.*"]
ignore_missing_imports = true
